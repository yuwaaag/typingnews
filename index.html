<script>
    // ========== CONFIGURATION ==========
    const CSV_LINK = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQhoLPXYZWErFbe1kcwZjgTIohG1Rxdnbe7f2OCXl25zKRkELj8Gz7Nye-GG9OTxkHMcqijYtves4vm/pub?gid=0&single=true&output=csv';
    
    let newsData = [];
    let currentIndex = 0;
    let isTyping = false;
    let typingInterval;
    
    const typingSound = document.getElementById('typingSound');
    const breakingSound = document.getElementById('breakingSound');
    const bgMusic = document.getElementById('bgMusic');
    
    // Set volumes
    typingSound.volume = 0.6; // Increased from 0.3
    breakingSound.volume = 0.8;
    bgMusic.volume = 0.25;

    // ========== CREATE PARTICLES ==========
    function createParticles() {
        const container = document.getElementById('particles');
        for (let i = 0; i < 50; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 15 + 's';
            particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
            container.appendChild(particle);
        }
    }

    // ========== UPDATE TIME ==========
    function updateTime() {
        const now = new Date();
        const time = now.toLocaleTimeString('hi-IN', { 
            hour12: false,
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit'
        });
        document.getElementById('timeDisplay').innerText = time;
    }
    
    setInterval(updateTime, 1000);
    updateTime();

    // ========== LOAD NEWS FROM GOOGLE SHEET ==========
    async function loadNews() {
        const loadingScreen = document.getElementById('loadingScreen');
        loadingScreen.style.display = 'flex';
        
        try {
            const response = await fetch(CSV_LINK + '&t=' + Date.now());
            const text = await response.text();
            const rows = text.split('\n').slice(1); // Skip header
            
            newsData = rows
                .map(row => row.trim())
                .filter(row => row.length > 5)
                .map(row => {
                    // Remove quotes and clean
                    return row.replace(/^"|"$/g, '').replace(/""/g, '"').trim();
                })
                .filter(text => text.length > 0);
            
            console.log(`✅ Loaded ${newsData.length} news items`);
            loadingScreen.style.display = 'none';
            return newsData.length > 0;
        } catch (e) {
            console.error("❌ Error loading news:", e);
            // Fallback news
            newsData = [
                "राजस्थान में भारी बारिश से 4 लोगों की मौत, कई इलाके जलमग्न",
                "दिल्ली मेट्रो की नई ब्लू लाइन एक्सटेंशन आज से शुरू",
                "भारतीय क्रिकेट टीम ने ऑस्ट्रेलिया को 10 विकेट से हराया",
                "शेयर बाजार में जबरदस्त तेजी, सेंसेक्स 1000 अंक ऊपर",
                "सरकार ने किसानों के लिए नई योजना की घोषणा की"
            ];
            loadingScreen.style.display = 'none';
            return true;
        }
    }

    // ========== TYPING ANIMATION ==========
    async function typeText(text) {
        const typedTextEl = document.getElementById('typedText');
        typedTextEl.textContent = '';
        isTyping = true;
        
        // Play breaking sound
        breakingSound.currentTime = 0;
        breakingSound.play().catch(e => console.log("Breaking sound error:", e));
        
        // Wait for breaking sound to finish
        await new Promise(resolve => setTimeout(resolve, 1500));
        
        // Start typing with sound
        for (let i = 0; i < text.length; i++) {
            if (!isTyping) break;
            
            typedTextEl.textContent += text[i];
            
            // Play typing sound (not for spaces)
            if (text[i] !== ' ' && text[i] !== '\n') {
                try {
                    typingSound.currentTime = 0;
                    const playPromise = typingSound.play();
                    if (playPromise !== undefined) {
                        playPromise.catch(e => {
                            console.log("Typing sound play error:", e);
                        });
                    }
                } catch (e) {
                    console.log("Typing sound error:", e);
                }
            }
            
            // Variable speed: faster for spaces, slower for punctuation
            let delay = 50;
            if (text[i] === ' ') delay = 30;
            if ([',', '.', '!', '?', '।'].includes(text[i])) delay = 200;
            
            await new Promise(resolve => setTimeout(resolve, delay));
        }
        
        isTyping = false;
    }

    // ========== UPDATE PROGRESS BAR ==========
    function animateProgressBar(duration) {
        const progressBar = document.getElementById('progressBar');
        let progress = 0;
        const increment = 100 / (duration / 50); // Update every 50ms
        
        const interval = setInterval(() => {
            progress += increment;
            if (progress >= 100) {
                progress = 100;
                clearInterval(interval);
            }
            progressBar.style.width = progress + '%';
        }, 50);
        
        return interval;
    }

    // ========== UPDATE COUNTER ==========
    function updateCounter() {
        document.getElementById('newsCounter').textContent = 
            `${currentIndex + 1}/${newsData.length}`;
    }

    // ========== MAIN NEWS LOOP ==========
    async function runNewsLoop() {
        if (newsData.length === 0) {
            await loadNews();
        }
        
        if (currentIndex >= newsData.length) {
            currentIndex = 0;
            await loadNews(); // Refresh data
        }
        
        const newsText = newsData[currentIndex];
        updateCounter();
        
        // Calculate typing duration
        const typingDuration = newsText.length * 50 + 1500; // Approximate
        
        // Start progress bar
        const progressInterval = animateProgressBar(typingDuration + 3000);
        
        // Type the text
        await typeText(newsText);
        
        // Wait 3 seconds after typing completes
        await new Promise(resolve => setTimeout(resolve, 3000));
        
        // Move to next news
        currentIndex++;
        
        // Reset progress bar
        document.getElementById('progressBar').style.width = '0%';
        
        // Continue loop
        runNewsLoop();
    }

    // ========== START NEWS ==========
    async function startNews() {
        // Hide overlay
        document.getElementById('startOverlay').style.display = 'none';
        
        // Initialize audio context (needed for some browsers)
        try {
            // Test play all sounds briefly to initialize them
